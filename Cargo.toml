[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored dependencies (git submodules) have their own workspaces.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/rustutils/sshutils"

[workspace.dependencies]
sshutils-core = { path = "crates/sshutils-core", version = "0.1.0" }
sshutils-testing = { path = "crates/sshutils-testing" }
russh = { version = "0.65.2", path = "vendor/russh/russh" }
clap = { version = "4.6.9", features = ["derive"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
bcrypt-pbkdf = "0.11.0"
hmac = "0.13.0"
md5 = "0.8.1"
sha1 = "0.11.0"
libc = "0.2.191"
rpassword = "7.5.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "signal", "time"] }
zeroize = "1.9.2"
