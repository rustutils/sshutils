[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/rustutils/sshutils"

[workspace.dependencies]
sshutils-core = { path = "crates/sshutils-core", version = "0.1.0" }
sshutils-testing = { path = "crates/sshutils-testing" }
russh = "0.65.2"
clap = { version = "4.6.9", features = ["derive"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
md5 = "0.8.1"
sha1 = "0.11.0"
libc = "0.2.191"
rpassword = "7.5.5"
tempfile = "3.27.0"
