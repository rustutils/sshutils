# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates we depend on directly; transitive ones (e.g.
# chrono via russh-util) are russh's to resolve.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only. Copyleft (GPL, LGPL, AGPL) is never allowed; weak
# copyleft (MPL-2.0) needs an explicit decision before it is added here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
